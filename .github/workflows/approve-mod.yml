
name: Approve Fusion Mod

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: fusion-mod-approval
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'Approved' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest

    steps:
      # 1. Verify maintainer permissions.
      - name: Verify approver permissions
        uses: actions/github-script@v7
        with:
          script: |
            const result =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });

            const permission = result.data.permission;

            if (!["admin", "maintain", "write"].includes(permission)) {
              core.setFailed("Only repository maintainers can approve mods.");
            }

      # 2. Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Install Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 4. Scan the submission.
      - name: Scan mod submission
        id: scan
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" | python scripts/review_submission.py
          
      # 5. Handle failed scans.
      - name: Reject failed scan
        if: steps.scan.outputs.passed != 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_REPORT: ${{ steps.scan.outputs.report }}
        with:
          script: |
            const issue_number = context.issue.number;
            const report = process.env.REVIEW_REPORT ||
              "## Fusion Submission Guard: Scan failed\n\n" +
              "The scanner did not provide a report. Check the Actions logs.";

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: "Approved"
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["needs-changes"]
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: report + "\n\nApproval was blocked. Correct these issues and request another review."
            });

      # 6. Stop if scanning failed.
      - name: Stop failed approval
        if: steps.scan.outputs.passed != 'true'
        run: |
          echo "Fusion Submission Guard blocked this approval."
          exit 1

      # 7. Register only after a successful scan.
      - name: Register approved mod
        if: steps.scan.outputs.passed == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/approve_submission.py

      # 8. Commit catalog changes.
      - name: Commit catalog changes
        if: steps.scan.outputs.passed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.json
          git commit -m "Register approved mod #${{ github.event.issue.number }}"
          git push
