
name: Approve Fusion Mod

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: fusion-mod-approval
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'Approved'
    runs-on: ubuntu-latest

    steps:
      - name: Verify approver permissions
        uses: actions/github-script@v7
        with:
          script: |
            const result =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });

            const permission = result.data.permission;

            if (!["admin", "maintain", "write"].includes(permission)) {
              core.setFailed(
                "Only repository maintainers can approve mods."
              );
            }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Register approved mod
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/approve_submission.py

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.json
          git commit -m "Register approved mod #${{ github.event.issue.number }}"
          git push
