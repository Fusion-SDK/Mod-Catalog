
name: Review Fusion Mod Submission

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: fusion-submission-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.state == 'open' &&
      (
        (github.event_name == 'issues' &&
         github.event.label.name == 'Needs Changes') ||
        (github.event_name == 'issue_comment' &&
         github.event.comment.body == 'Ready for re-review' &&
         github.event.comment.user.login == github.event.issue.user.login)
      )
    runs-on: ubuntu-latest

    steps:
      # 1. Get GitHub repository permission for staff-triggered reviews.
      - name: Get reviewer GitHub permission
        id: github-permission
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const result =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });

            core.setOutput("permission", result.data.permission);

      # 2. Load repository configuration.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Verify Fusion reviewer role for staff-triggered reviews.
      - name: Verify Fusion reviewer role
        if: github.event_name == 'issues'
        env:
          REQUIRED_ROLE: reviewers
          GITHUB_PERMISSION: ${{ steps.github-permission.outputs.permission }}
        run: python scripts/check_permissions.py

      # 4. Inspect the submission and capture the scanner exit code.
      - name: Inspect submission
        id: inspect
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e

          printf '%s' "$ISSUE_BODY" | python scripts/review_submission.py > review.txt 2>&1
          status=$?

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          cat review.txt

          exit 0

      # 5. Post the review report.
      - name: Post review report
        uses: actions/github-script@v7
        env:
          SCAN_EXIT_CODE: ${{ steps.inspect.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');

            const report = fs.readFileSync('review.txt', 'utf8').trim();
            const scanFailed = process.env.SCAN_EXIT_CODE !== "0";

            let message;

            if (scanFailed) {
              message = [
                "## Fusion Submission — Changes Required",
                "",
                "The automated checks did not pass. Please review the report below:",
                "",
                report || "The scanner did not return a report. A maintainer should inspect the Actions logs.",
                "",
                "### What to do next",
                "1. Edit your original issue.",
                "2. Correct the reported problems.",
                "3. Comment `Ready for re-review` when finished.",
                "",
                "Your submission has not been added to the catalog."
              ].join("\n");
            } else {
              message = [
                "## Fusion Submission — Automated Checks Passed",
                "",
                "The submission passed automated validation.",
                "A Fusion maintainer must still complete the manual review.",
                "",
                "No catalog entry has been created yet."
              ].join("\n");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
