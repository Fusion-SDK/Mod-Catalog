
name: Review Fusion Mod Submission

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: fusion-submission-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event.label.name == 'needs-changes' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest

    steps:
      # 1. Get GitHub repository permission.
      - name: Get reviewer GitHub permission
        id: github-permission
        uses: actions/github-script@v7
        with:
          script: |
            const result =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });

            core.setOutput("permission", result.data.permission);

      # 2. Load repository configuration.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Verify Fusion staff role.
      - name: Verify Fusion reviewer role
        env:
          REQUIRED_ROLE: reviewers
          GITHUB_PERMISSION: ${{ steps.github-permission.outputs.permission }}
        run: python scripts/check_permissions.py

      # 4. Inspect submission.
      - name: Inspect submission
        id: inspect
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" | python scripts/review_submission.py > review.txt
          cat review.txt

      # 5. Post review report.
      - name: Post review report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review.txt', 'utf8').trim();

            let message;

            if (report.startsWith("NEEDS_CHANGES")) {
              message = [
                "## Fusion Submission — Changes Required",
                "",
                "Thanks for submitting your mod! Our automated reviewer found the following issues:",
                "",
                report.replace("NEEDS_CHANGES", "").trim(),
                "",
                "### What to do next",
                "1. Edit your original issue.",
                "2. Correct each item listed above.",
                "3. Comment `Ready for re-review` when finished.",
                "",
                "Your submission has not been added to the catalog."
              ].join("\n");
            } else {
              message = [
                "## Fusion Submission — Automated Checks Passed",
                "",
                "The required fields passed automated validation.",
                "A Fusion maintainer must still complete the manual review.",
                "",
                "No catalog entry has been created yet."
              ].join("\n");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
