
name: Approve Fusion Mod Update

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: fusion-mod-update-approval
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event.label.name == 'approved-update' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'mod-update')
    runs-on: ubuntu-latest

    steps:
      - name: Get approver GitHub permission
        id: github-permission
        uses: actions/github-script@v7
        with:
          script: |
            const result =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });

            core.setOutput("permission", result.data.permission);

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify Fusion moderator role
        env:
          REQUIRED_ROLE: moderators
          GITHUB_PERMISSION: ${{ steps.github-permission.outputs.permission }}
        run: python scripts/check_permissions.py

     
      - name: Revalidate update submission
        id: validation
        env:
          MOD_ID: ${{ steps.fields.outputs.MOD_ID }}
          CURRENT_VERSION: ${{ steps.fields.outputs.CURRENT_VERSION }}
          NEW_VERSION: ${{ steps.fields.outputs.NEW_VERSION }}
          DOWNLOAD_URL: ${{ steps.fields.outputs.DOWNLOAD_URL }}
          RELEASE_URL: ${{ steps.fields.outputs.RELEASE_URL }}
          PACKAGE_TYPE: ${{ steps.fields.outputs.PACKAGE_TYPE }}
          SHA256: ${{ steps.fields.outputs.SHA256 }}
        run: |
          set +e
          python scripts/validate_mod_update.py > validation.txt 2>&1
          result=$?
          cat validation.txt
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
        
      - name: Extract update fields
        id: fields
        uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const body = process.env.ISSUE_BODY || "";

            const fields = {
              MOD_ID: "Mod ID",
              CURRENT_VERSION: "Current Catalog Version",
              NEW_VERSION: "Proposed New Version",
              DOWNLOAD_URL: "Updated Package Download URL",
              RELEASE_URL: "Upstream Release URL",
              PACKAGE_TYPE: "Package Type",
              SHA256: "SHA-256 Checksum"
            };

            for (const [key, heading] of Object.entries(fields)) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(
                `### ${escaped}\\s*\\r?\\n+([\\s\\S]*?)(?=\\r?\\n### |$)`
              );

              const match = body.match(regex);
              core.setOutput(key, match ? match[1].trim() : "");
            }


      - name: Block invalid update
        if: steps.validation.outputs.exit_code != '0'
        run: |
          echo "Update validation failed."
          exit 1

      - name: Apply approved update
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/approve_mod_update.py

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog/index.json

          if git diff --cached --quiet; then
            echo "No catalog changes detected."
            exit 1
          fi

          git commit -m "Update catalog mod from issue #${{ github.event.issue.number }}"
          git push

      - name: Close approved update
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "## Fusion Mod Update — Approved\n\nThe update was validated and committed to the catalog."
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: "closed",
              state_reason: "completed"
            });

            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              lock_reason: "resolved"
            });
