
name: Reject Fusion Mod

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  reject:
    if: github.event.label.name == 'Rejected'
    runs-on: ubuntu-latest

    steps:
      - name: Verify approver permissions
        uses: actions/github-script@v7
        with:
          script: |
            const result =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });

            const permission = result.data.permission;

            if (!["admin", "maintain", "write"].includes(permission)) {
              core.setFailed(
                "Only repository maintainers can reject mods."
              );
            }

      - name: Comment on rejected submission
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "## Fusion Mod Submission Rejected",
                "",
                "Thank you for submitting your mod to Fusion.",
                "Unfortunately, this submission was not approved for the catalog.",
                "",
                "You may contact the Fusion team if you believe this decision was made in error."
              ].join("\n")
            });

      - name: Close rejected submission
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "not_planned"
            });
