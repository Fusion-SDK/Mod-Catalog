
name: Mod Update Submission
description: Submit an update for an existing Fusion catalog mod.
title: "[MOD UPDATE] "
labels: ["mod-update"]
body:
  - type: markdown
    attributes:
      value: |
        ## Fusion Mod Update
        Use this form to submit a new version of an already registered Fusion catalog mod.
        Do not use this form to register a brand-new mod.
        For Geode mods, provide a separate Fusion ZIP if the updated mod supports Fusion.

  - type: input
    id: mod_id
    attributes:
      label: Mod ID
      description: The exact ID of the mod in catalog/index.json.
      placeholder: example-mod
    validations:
      required: true

  - type: input
    id: developer
    attributes:
      label: Developer GitHub Username
      placeholder: username
    validations:
      required: true

  - type: input
    id: current_version
    attributes:
      label: Current Catalog Version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: new_version
    attributes:
      label: Proposed New Version
      placeholder: 1.1.0
    validations:
      required: true

  - type: input
    id: download_url
    attributes:
      label: Updated Package Download URL
      description: Direct HTTPS link to the new primary package.
      placeholder: https://example.com/releases/mod.zip
    validations:
      required: true

  - type: input
    id: release_url
    attributes:
      label: Upstream Release URL
      description: Link to the official release page or repository.
      placeholder: https://github.com/username/project/releases
    validations:
      required: true

  - type: dropdown
    id: package_type
    attributes:
      label: Package Type
      options:
        - ZIP
        - GEODE
        - EXE
    validations:
      required: true

  - type: input
    id: sha256
    attributes:
      label: SHA-256 Checksum
      description: SHA-256 checksum of the updated primary package.
      placeholder: 64-character hexadecimal checksum
    validations:
      required: true

  - type: dropdown
    id: fusion_package_included
    attributes:
      label: Separate Fusion ZIP included?
      description: For Geode mods, select Yes if this update includes a separate Fusion-compatible ZIP. For Fusion-native mods, select No.
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: input
    id: fusion_download_url
    attributes:
      label: Updated Fusion ZIP Download URL
      description: Required when the separate Fusion ZIP option is Yes. Must point to a GitHub release ZIP asset.
      placeholder: https://github.com/username/project/releases/download/v1.1.0/mod-fusion.zip
    validations:
      required: false

  - type: input
    id: fusion_sha256
    attributes:
      label: Fusion ZIP SHA-256 Checksum
      description: Required when the separate Fusion ZIP option is Yes.
      placeholder: 64-character hexadecimal checksum
    validations:
      required: false

  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Explain what changed in this version.
      placeholder: |
        - Added...
        - Fixed...
    validations:
      required: true
