
name: Fusion Staff Management
description: Request a staff role change.
title: "[Staff Request]: "
labels:
  - staff-request
body:
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Add staff member
        - Remove staff member
    validations:
      required: true

  - type: input
    id: username
    attributes:
      label: GitHub Username
      description: Enter the username without @.
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Staff Role
      options:
        - Reviewer
        - Moderator
        - Administrator
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this change is needed.
    validations:
      required: true
