
name: Register Fusion Mod
description: Submit a Geometry Dash mod for inclusion in the Fusion Mod Catalog.
title: "[MOD REGISTRATION] "
labels:
  - Mod Submission

body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting your mod to Fusion!

        Submissions will be reviewed before being added to the catalog.

        Make sure all information is accurate. Geode mods require the Geode loader.

  - type: input
    id: mod_name
    attributes:
      label: Mod Name
      placeholder: Example Mod
    validations:
      required: true

  - type: input
    id: mod_id
    attributes:
      label: Mod ID
      description: Unique ID using lowercase letters, numbers, hyphens, or underscores.
      placeholder: example-mod
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Mod Description
      placeholder: Explain what your mod does.
    validations:
      required: true

  - type: input
    id: creator
    attributes:
      label: Mod Creator
      description: Display name of the original mod creator.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mod Version
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Mod Runtime
      description: Select which environment this mod requires.
      options:
        - Fusion
        - Geode
    validations:
      required: true

  - type: dropdown
    id: package_type
    attributes:
      label: Package Type
      description: Select the downloadable package format.
      options:
        - ZIP
        - GEODE
    validations:
      required: true

  - type: input
    id: download
    attributes:
      label: GitHub Release Download URL
      description: Direct link to the downloadable package file.
      placeholder: https://github.com/owner/repository/releases/download/v1.0.0/mod.zip
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Upstream Release URL
      description: Link to the official release page.
      placeholder: https://github.com/owner/repository/releases
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source Repository
      description: Link to the mod's source repository.
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: input
    id: icon
    attributes:
      label: Mod Icon URL
      description: Direct HTTPS link to the mod icon.
    validations:
      required: true

  - type: input
    id: sha256
    attributes:
      label: Package SHA-256
      description: The 64-character SHA-256 hash of the downloadable package.
      placeholder: Paste the package SHA-256 hash
    validations:
      required: true

  - type: textarea
    id: platforms
    attributes:
      label: Supported Platforms
      description: "Comma-separated platform names. Supported values: windows, macos, linux, android, ios."
      placeholder: "windows, linux, macos, android, ios"
    validations:
      required: true

  - type: input
    id: geode_minimum
    attributes:
      label: Minimum Geode Version
      description: Required for Geode mods. Leave blank for Fusion mods.
      placeholder: 4.0.0
    validations:
      required: false

  - type: input
    id: geode_maximum
    attributes:
      label: Maximum Geode Version
      description: Optional. Leave blank if there is no known maximum.
      placeholder: 5.0.0
    validations:
      required: false

  
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Optional comma-separated Mod IDs required by this mod."
      placeholder: "example-library, another-mod"
    validations:
      required: false

  - type: textarea
    id: conflicts
    attributes:
      label: Conflicts
      description: "Optional comma-separated Mod IDs incompatible with this mod."
      placeholder: "conflicting-mod"
    validations:
      required: false

  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions
      options:
        - label: I own this mod or have permission to submit it.
          required: true
        - label: I have permission to distribute this downloadable package.
          required: true
